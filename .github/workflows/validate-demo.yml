name: Validate Demo Fixtures

# Deliberately no path filter. A schema change anywhere — a validator, a skill's
# documented output, a workspace convention — can invalidate the demo, and filtering on
# examples/** would skip exactly those pull requests.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  demo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/demo-check.sh
        run: |
          chmod +x scripts/demo-check.sh
          scripts/demo-check.sh
